name: multiagent-customer-service-v3
services:
  app:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ECHOMIND_EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    ports: ["127.0.0.1:8010:8010"]
    volumes: ["./data:/app/data"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
